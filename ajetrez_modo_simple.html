<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ajetrez — Modo Simple (UI unificada)</title>

<style>
/* ======================================================
   SISTEMA UNIFICADO WEB + MÓVIL (BASE DESKTOP)
   ====================================================== */
:root{
  --square-base: 56px;   /* tamaño real desktop */
  --ui-scale: 1;         /* factor general */

  --square: calc(var(--square-base) * var(--ui-scale));
  --square-menu: var(--square);
  --border: 2px;
  --board-cols: 24;
  --toolbar-h: calc(64px * var(--ui-scale));
  --toolbar-gap: calc(10px * var(--ui-scale));
  --mode-x: calc(180px * var(--ui-scale));
  --mode-y: calc(6px * var(--ui-scale));
}

@media (max-width: 900px){
  :root{
    --ui-scale: 0.82; /* AJUSTABLE */
  }
}

*{ box-sizing:border-box; }

body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#f5f5f5;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Arial, sans-serif;
  font-size: calc(16px * var(--ui-scale));
}

.frame{
  background: linear-gradient(to bottom, #dedede 0%, #e9e9e9 24%, #fafafa 50%, #8a8a8a 72%, #2e2e2e 100%);
  border: var(--border) solid #c9c9c9;
  border-radius: 12px;
  padding: calc(14px * var(--ui-scale));
  box-shadow: 0 6px 20px rgba(0,0,0,.08);
}

.shell{
  display:grid;
  grid-template-rows: var(--toolbar-h) var(--toolbar-gap) auto var(--toolbar-gap) var(--toolbar-h);
  justify-items:center;
}

.bar{ height:var(--toolbar-h); position:relative; }

/* ================= BOTONES ================= */
.btn{
  appearance:none;
  border:none;
  border-radius:999px;
  padding: calc(8px * var(--ui-scale)) calc(12px * var(--ui-scale));
  font-weight:800;
  font-size: calc(14px * var(--ui-scale));
  cursor:pointer;
  background:#111;
  color:#fff;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

.btn:hover{ background:#222; }
.btn.selected{ background:#b91c1c; }

/* ================= TABLERO ================= */
#board{
  display:grid;
  grid-template-columns: repeat(24, var(--square));
  grid-template-rows: repeat(8, var(--square));
  outline: 3px dashed rgba(0,0,0,.15);
  outline-offset: calc(6px * var(--ui-scale));
}

.sq{
  width:var(--square);
  height:var(--square);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size: calc(var(--square) * 0.64);
}

.sq.central.light{ background:#e4ebf5; }
.sq.central.dark{ background:#aeb8c7; }
.sq.lateral.light{ background:#eef2f8; }
.sq.lateral.dark{ background:#d7e0ec; }

/* ================= BOTÓN MENÚ ================= */
#btnMegaMenu{
  position:absolute;
  left:50%;
  top: calc(100% - (var(--square) * 0.5));
  transform:translateX(-50%);
  z-index:50;
}

/* ================= PANEL ================= */
#panelBackdrop{
  position:absolute;
  inset:0;
  background: rgba(0,0,0,.35);
  display:none;
  z-index:30;
}

#megaPanel{
  position:absolute;
  top:0;
  left:50%;
  transform:translateX(-50%);
  width: calc(var(--square-menu) * 16);
  height: calc(var(--square-menu) * 8);
  background:#fff;
  border-radius:16px;
  display:none;
  flex-direction:column;
  overflow:hidden;
  border:2px solid #111;
  z-index:40;
}

.mp-header{
  padding: calc(10px * var(--ui-scale)) calc(12px * var(--ui-scale));
  background:#111;
  color:#fff;
  font-weight:800;
}

.mp-tabs{
  display:flex;
  gap: calc(8px * var(--ui-scale));
  padding: calc(8px * var(--ui-scale)) calc(12px * var(--ui-scale));
}

.mp-content{
  flex:1;
  padding: calc(14px * var(--ui-scale));
  overflow:auto;
}
</style>
</head>

<body>
  <div class="frame">
    <div class="shell">
      <div class="bar"></div>
      <div></div>
      <div id="board"></div>
      <div></div>
      <div class="bar"></div>
    </div>

    <button id="btnMegaMenu" class="btn">Menú</button>

    <div id="panelBackdrop"></div>
    <div id="megaPanel">
      <div class="mp-header">Menú</div>
      <div class="mp-tabs">
        <button class="btn selected">Modo Simple</button>
      </div>
      <div class="mp-content">
        <p>Panel unificado. Desktop y móvil usan la misma UI escalada.</p>
      </div>
    </div>
  </div>
</body>
</html>
